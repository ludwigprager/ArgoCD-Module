
services:
  gitea:
    image: 'gitea/gitea:1.25.5'

    hostname: "${GITEA}"
    container_name: ${GITEA}
    environment:
      - USER=git
      - USER_UID=$USER_UID
      - USER_GID=$USER_GID
      - GITEA__server__DOMAIN=${GITEA}
      - GITEA__server__SSH_DOMAIN=${GITEA}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_LISTEN_PORT=22
      - GITEA__server__SSH_PORT=8022
      - GITEA__server__ROOT_URL=http://${GITEA}:3000
      - ONLY_ALLOW_PUSH_IF_GITEA_ENVIRONMENT_SET=false
      - GITEA__security__INSTALL_LOCK=true   # required - marks gitea as installed
    restart: unless-stopped
    ports:
      - '8022:22'
      - '3000:3000'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://${GITEA}:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
#   volumes:
#     - ./gitea-data:/data

  db2:
    image: 'icr.io/db2_community/db2:${DB2_VERSION}'

    hostname: "${DB2}"
    container_name: ${DB2}
    # Db2 sets kernel and IPC parameters while creating the instance; the
    # community image does not start without full privileges.
    privileged: true
    # docker's default 64m /dev/shm is too small for the Db2 engine
    shm_size: '2gb'
    environment:
      - LICENSE=${DB2_LICENSE}
      - DB2INSTANCE=${DB2_INSTANCE}
      - DB2INST1_PASSWORD=${DB2_PASSWORD}
      - DBNAME=${DB2_DBNAME}
      - BLU=false
      - ENABLE_ORACLE_COMPATIBILITY=false
      - UPDATEAVAIL=NO
      - TO_CREATE_SAMPLEDB=false
      - REPODB=false
      - IS_OSXFS=false
      - PERSISTENT_HOME=true
      - HADR_ENABLED=false
    restart: unless-stopped
    ports:
      - '${DB2_PORT}:50000'
    volumes:
      # state stays inside the clone, like container/gitea-data: a named volume
      # would survive `rm -rf` of the clone as orphaned residue, and its
      # docker-global name would collide between two clones of this module.
      # Db2 writes this as root - ../90-teardown.sh deletes it from inside a
      # container. This is also the mount IBM's own docs use.
      - ./db2-data:/database
      # The db2 image declares VOLUME /hadr. Left alone, docker creates an
      # anonymous volume for it per container, and `compose down -v` does not
      # reliably remove it - verified: one survived a clean teardown. Binding
      # it into the clone means no anonymous volume is ever created.
      - ./db2-hadr:/hadr

  mssql:
    image: 'mcr.microsoft.com/mssql/server:${MSSQL_VERSION}'

    hostname: "${MSSQL}"
    container_name: ${MSSQL}
    # The image already runs as the non-root user `mssql` (uid 10001), so it
    # cannot write a bind mount owned by the host user. Running it as the host
    # user instead is the same trick gitea uses, and it is what keeps
    # ./mssql-data removable by a plain `rm -rf` of the clone - no privileged
    # container needed to clean up, unlike db2.
    user: "${USER_UID}:${USER_GID}"
    environment:
      - ACCEPT_EULA=${MSSQL_EULA}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
    restart: unless-stopped
    ports:
      - '${MSSQL_PORT}:1433'
    volumes:
      - ./mssql-data:/var/opt/mssql
